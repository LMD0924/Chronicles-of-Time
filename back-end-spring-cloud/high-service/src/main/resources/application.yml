# 文件说明：拾光记微服务后端高中服务配置文件，统一维护服务端口、注册发现、数据源和中间件参数。
spring:
  application:
    name: high-service
  datasource:
    url: jdbc:mysql://localhost:3306/cot_highschool?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    #password: 0924
    password: Liu0924#
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      idle-timeout: 30000
      connection-timeout: 3000
server:
  port: 8082

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

# 高中模块 AI 分析配置
# 优先使用环境变量 HIGH_AI_API_KEY，避免把真实密钥提交到代码仓库。
high:
  ai:
    enabled: true
    provider: openai-compatible
    base-url: ${HIGH_AI_BASE_URL:https://api.openai.com/v1}
    model: ${HIGH_AI_MODEL:gpt-4o-mini}
    api-key: ${HIGH_AI_API_KEY:}
    timeout-seconds: ${HIGH_AI_TIMEOUT_SECONDS:30}
    max-tokens: ${HIGH_AI_MAX_TOKENS:1200}
    temperature: ${HIGH_AI_TEMPERATURE:0.2}
