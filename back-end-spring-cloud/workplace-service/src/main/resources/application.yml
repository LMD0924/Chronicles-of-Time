# 文件说明：拾光记微服务后端配置文件，统一维护服务端口、注册发现、数据源和中间件参数。
server:
  port: 8085

spring:
  application:
    name: workplace-service
  datasource:
    url: jdbc:mysql://localhost:3306/cot_workplace?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    #password: 0924
    password: Liu0924#
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
# AI mock interview configuration. Prefer environment variables for secrets.
workplace:
  ai:
    base-url: ${WORKPLACE_AI_BASE_URL:https://api.openai.com/v1}
    model: ${WORKPLACE_AI_MODEL:gpt-4o-mini}
    api-key: ${}
    timeout-seconds: ${WORKPLACE_AI_TIMEOUT_SECONDS:45}
    max-tokens: ${WORKPLACE_AI_MAX_TOKENS:1000}
    temperature: ${WORKPLACE_AI_TEMPERATURE:0.5}
