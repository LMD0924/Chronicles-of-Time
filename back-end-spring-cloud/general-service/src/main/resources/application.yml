# 文件说明：拾光记微服务后端通用内容服务配置文件，统一维护服务端口、注册发现、数据源和中间件参数。
spring:
  application:
    name: general-service

  datasource:
    dynamic:
      primary: cot_content
      strict: false
      datasource:
        cot_content:
          url: jdbc:mysql://localhost:3306/cot_content?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
          username: root
          #password: 0924
          password: Liu0924#
          driver-class-name: com.mysql.cj.jdbc.Driver
        cot_learning:
          url: jdbc:mysql://localhost:3306/cot_learning?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
          username: root
          #password: 0924
          password: Liu0924#
          driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8084

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 认证中心地址
auth:
  center:
    url: http://localhost:8080

# 关闭数据源健康检查
management:
  health:
    db:
      enabled: false